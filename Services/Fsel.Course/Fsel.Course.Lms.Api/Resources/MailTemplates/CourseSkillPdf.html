<div style="margin: 0px auto; max-width: 600px; text-align: left; background-color: #F9FAFB; padding: 10px; border-radius: 10px; margin-bottom: 10px">
    <table style="width: 100%; border-collapse: collapse;" cellpadding="0" cellspacing="0">
        <tbody>
            <tr>
                <td style="text-align: justify;">
                    <div style="height: 16px;">
                        <img style="
                                float: left;
                                width: 26px;
                                height: 26px;
                            " src="{0}" alt="">
                        <span style="
                                float: left;
                                margin-top: 3px;
                                color: #3A4B78;
                                font-family: 'Inter', sans-serif;
                                font-size: 12px;
                                font-style: normal;
                                font-weight: 600;
                                line-height: 22px;
                                margin-left: 10px;
                            ">{1}</span>
                    </div>
                </td>
                <td style="
                            text-align: right;
                        ">
                    <span style="
                                color: {2};
                                font-family: 'Inter', sans-serif;
                                font-size: 12px;
                                font-style: normal;
                                font-weight: 600;
                                line-height: 16px;
                            ">{3}%</span>
                </td>
            </tr>
            <tr style="width: 100%;">
                <td style="width: 100%" colspan="2">
                    <table class="{4}" style="border: 0; margin: 8px 0;" cellpadding="0" cellspacing="0" width="100%">
                        <tr>
                            <td style="
                                    width:{5}%;
                                    background: {6};
                                    float:left;
                                    height:10px;
                                    border-top-left-radius: 10px;
                                    border-bottom-left-radius: 10px;
                                    {7}
                                "></td>
                            <td style="
                                    width: {8}%;
                                    background-color:#E2E4E9;
                                    float:left;
                                    height:10px;
                                    border-top-right-radius: 10px;
                                    border-bottom-right-radius: 10px;
                                    {9}
                                "></td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <span style="
                                color: #31415A;
                                font-family: 'Inter', sans-serif;
                                font-size: 10px;
                                font-style: normal;
                                font-weight: 400;
                                line-height: 16px;
                            ">{10}</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

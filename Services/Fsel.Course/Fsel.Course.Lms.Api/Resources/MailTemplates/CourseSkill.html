<div style="margin: 0px auto; max-width: 600px; text-align: left; background-color: #F9FAFB; padding: 10px; border-radius: 10px; margin-bottom: 20px">
    <table style="width: 100%;">
        <tbody>
            <tr>
                <td style="text-align: justify;">
                    <div style="height: 36px;">
                        <img style="
                                float: left;
                                width: 36px;
                                height: 36px;
                            " src="{0}" alt="">
                        <span style="
                                float: left;
                                margin-top: 3px;
                                color: #3A4B78;
                                font-family: 'Inter', sans-serif;
                                font-size: 24px;
                                font-style: normal;
                                font-weight: 600;
                                line-height: 32px;
                                margin-left: 10px;
                                height: 36px;
                            ">{1}</span>
                    </div>
                </td>
                <td style="
                            text-align: right;
                        ">
                    <span style="
                                color: {2};
                                font-family: 'Inter', sans-serif;
                                font-size: 22px;
                                font-style: normal;
                                font-weight: 600;
                                line-height: 28px;
                            ">{3}%</span>
                </td>
            </tr>
            <tr style="width: 100%;">
                <td style="width: 100%" colspan="2">
                    <table class="{4}" style="border: 0; margin: 10px 0;" cellpadding="0" cellspacing="0" width="100%">
                        <tr>
                            <td style="
                                    width:{5}%;
                                    background: {6};
                                    float:left;
                                    height:15px;
                                    border-top-left-radius: 10px;
                                    border-bottom-left-radius: 10px;
                                "></td>
                            <td style="
                                    width: {7}%;
                                    background-color:#E2E4E9;
                                    float:left;
                                    height:15px;
                                    border-top-right-radius: 10px;
                                    border-bottom-right-radius: 10px;
                                "></td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <span style="
                                color: #31415A;
                                font-family: 'Inter', sans-serif;
                                font-size: 20px;
                                font-style: normal;
                                font-weight: 400;
                                line-height: 28px;
                            ">{8}</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

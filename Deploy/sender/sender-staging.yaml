apiVersion: apps/v1
kind: Deployment
metadata:
  name: sender-staging
spec:
  selector:
    matchLabels:
      app: sender-staging
  replicas: 1
  template:
    metadata:
      labels:
        app: sender-staging
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node_role
                operator: In
                values:
                - appnodes-staging
      containers:
      - name: sender-staging
        image: registry.fsel.edu.vn/fsel/api/fsel_src/sender:..........
        ports:
        - containerPort: 80
        - containerPort: 443 
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 30m
            memory: 50Mi
      imagePullSecrets:
        - name: gitlab-fsel-secret

---
apiVersion: v1
kind: Service
metadata:
  name: sender-staging
  labels:
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: sender-staging



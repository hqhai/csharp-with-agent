apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcmsapi-staging
spec:
  selector:
    matchLabels:
      app: lcmsapi-staging
  replicas: 1
  template:
    metadata:
      labels:
        app: lcmsapi-staging
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node_role
                operator: In
                values:
                - appnodes-staging
      containers:
      - name: lcmsapi-staging
        image: registry.fsel.edu.vn/fsel/api/fsel_src/lcmsapi:..........
        ports:
        - containerPort: 80
        - containerPort: 443 
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 30m
            memory: 50Mi
        volumeMounts:
        - mountPath: /app/appsettings.Staging.json
          name: lcmsapi-appsettings-staging
          subPath: appsettings.Staging.json
      imagePullSecrets:
        - name: gitlab-fsel-secret
      tolerations:
      - effect: NoSchedule
        key: appnodes-staging
        operator: Exists
      volumes:
      - configMap:
          defaultMode: 420
          name: lcmsapi-appsettings-staging
        name: lcmsapi-appsettings-staging

---
apiVersion: v1
kind: Service
metadata:
  name: lcmsapi-staging
  labels:
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: lcmsapi-staging



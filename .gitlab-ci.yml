variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0" 
  DOCKER_TLS_CERTDIR: ''
  DOCKER_DRIVER: overlay2
  #DOCKER_HOST: tcp://docker:2375
  GIT_STRATEGY: clone

image: mirror.gcr.io/library/docker:27

services:
- name: mirror.gcr.io/library/docker:27-dind
  alias: docker

before_script:
  - export CURRENT_TIME=$(date +"%d%m%y")
  - export TAG=$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA-$CURRENT_TIME
  - export IMAGE_VALUES=$CI_COMMIT_SHORT_SHA-$CURRENT_TIME
  - echo $TAG

stages:
- build-image
- deploy
- build-multi-subject-testing

".build-image-gitlab-registry":
  stage: build-image
  tags:
  - docker-runner
  retry:
    max: 2
  script:
    - apk add --update coreutils && rm -rf /var/cache/apk/*
    - docker login registry.fsel.edu.vn -u $DOCKER_USER -p $DOCKER_PASS
    - docker build -f $DOCKERFILE -t $IMAGE_NAME:multi-subject-testing-$IMAGE_VALUES .
    - docker push $IMAGE_NAME:multi-subject-testing-$IMAGE_VALUES

build-multi-subject-testing-auth:
  stage: build-multi-subject-testing
  tags:
  - docker-runner
  retry:
    max: 2
  script:
    - apk add --update coreutils && rm -rf /var/cache/apk/*
    - docker login registry.fsel.edu.vn -u $DOCKER_USER -p $DOCKER_PASS
    - docker build -f $DOCKERFILE -t $IMAGE_NAME:multi-subject-testing-$IMAGE_VALUES .
    - docker push $IMAGE_NAME:multi-subject-testing-$IMAGE_VALUES
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/auth
    DOCKERFILE: "./Environments/Testing/Auth.Testing.Dockerfile"
  extends: ".build-image-gitlab-registry"
  only:
    changes:
    - Services/Fsel.Identity/**/*
    - Services/Shared/**/*
    refs:
    - testing-multiple-subject


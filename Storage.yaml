apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-api
  template:
    metadata:
      labels:
        app: storage-api
    spec:
      containers:
      - name: storage
        image: fselacr.azurecr.io/storageapi
        imagePullPolicy: Always
        ports:
        - containerPort: 80
# service type loadbalancer       
---
apiVersion: v1
kind: Service
metadata:
  name: storage-api-svc
spec:
  selector:
    app: storage-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
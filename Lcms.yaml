apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcms-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lcms-app
  template:
    metadata:
      labels:
        app: lcms-app
    spec:
      containers:
      - name: lcms
        image: lcmswebacr.azurecr.io/fsel_src
        imagePullPolicy: Always
        ports:
        - containerPort: 80
# service type loadbalancer       
---
apiVersion: v1
kind: Service
metadata:
  name: lcms-app-svc
spec:
  selector:
    app: lcms-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer